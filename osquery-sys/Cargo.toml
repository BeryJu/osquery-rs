[package]
name = "osquery-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords.workspace = true
categories.workspace = true
description = "Low-level FFI bindings to an in-process embedded osquery runtime"
links = "osquery_embed_shim"
build = "build.rs"

[dependencies]

[build-dependencies]
cc = "1"
shlex = "2"
# Only used by the prebuilt-artifact download path (see build.rs) -- the
# from-source path (and everything shlex/cc are used for) never touches
# these. ureq is blocking (fits build.rs's synchronous execution model, no
# async runtime) with default-features disabled to skip cookies/gzip/brotli/
# charset support we don't need for one plain GET of a release asset.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
