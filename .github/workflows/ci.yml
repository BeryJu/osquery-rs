name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # This workflow's whole purpose is verifying the from-source build path
  # keeps working -- without this, once a real release exists and
  # prebuilt-checksums.v1 has entries, every job here would silently take
  # the (much faster, much less thoroughly exercised by CI) prebuilt
  # download path instead, and this workflow would stop actually testing
  # what it's meant to. See osquery-sys/build.rs's try_prebuilt.
  OSQUERY_SYS_FORCE_SOURCE_BUILD: "1"

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Restore osquery source + native build cache
        uses: actions/cache@v6
        with:
          # build.rs clones osquery's pinned tag itself (no git submodule)
          # and caches both the cloned source and the native build under
          # target/osquery-sys/{src,build}-<tag>/ -- see cargo_target_dir()
          # in osquery-sys/build.rs.
          path: target/osquery-sys
          key: osquery-sys-linux-${{ hashFiles('osquery-sys/build.rs') }}

      - name: Build + test inside manylinux2014 (glibc 2.17 floor)
        # GitHub Actions can't run this job's *own* steps (actions/checkout,
        # actions/cache, ...) inside a manylinux2014 container via the
        # job-level `container:` key: Actions injects a Node.js runtime into
        # the job container to execute its own JS-based steps, and modern
        # Node requires a far newer glibc than manylinux2014's CentOS-7-era
        # 2.17. That was tried first and failed at the very first step --
        # actions/checkout@v7 itself crashed with "GLIBC_2.27/2.28 not
        # found" errors before any of our own build logic ever ran.
        #
        # Fix: keep this job on the ordinary ubuntu-latest host (where
        # GitHub's own Node-based steps work fine) and invoke the
        # manylinux2014 image manually via `docker run` for only the actual
        # build+test step. The container's old glibc only needs to be
        # present for *our* compiler/linker invocations -- specifically the
        # final link, which dynamically resolves -lc/-lresolv against
        # whatever the host's own system libc is (see
        # append_linux_default_linker_items in osquery-sys/build.rs) -- not
        # for anything Actions itself runs. This matters because of the
        # prebuilt-artifact distribution model: it's this build's own output
        # that gets uploaded and run on other people's machines, so the
        # glibc version *the container* provides directly determines the
        # oldest Linux distro the shipped artifact will work on.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e OSQUERY_SYS_FORCE_SOURCE_BUILD \
            quay.io/pypa/manylinux2014_x86_64 \
            bash .github/scripts/manylinux-entrypoint.sh \
            bash .github/scripts/linux-cargo-build-test.sh

  macos:
    name: macOS (aarch64)
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      # osquery's own docs state its macOS build is broken on Xcode SDK
      # >= 16.3; macos-14 runners ship multiple Xcode versions side by side.
      # Pin an explicit, older one rather than whatever Xcode.app currently
      # defaults to (unverified as of this writing -- adjust this version
      # if the build fails on SDK incompatibility; check
      # `ls /Applications | grep Xcode` in a run for what's actually
      # available on the runner image in use).
      - name: Select a supported Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Install build prerequisites
        run: brew install ccache git git-lfs cmake python clang-format flex bison

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Restore osquery source + native build cache
        uses: actions/cache@v6
        with:
          path: target/osquery-sys
          key: osquery-sys-macos-${{ hashFiles('osquery-sys/build.rs') }}

      - name: cargo build
        # -vv makes Cargo forward build.rs's own captured stdout/stderr live
        # (plain -v only shows compiler invocation lines, not build-script
        # output) -- this build spawns cmake/git as child processes with
        # inherited stdio, so their progress only reaches the Actions log
        # stream at this verbosity. Without it, a genuinely slow multi-hour
        # native build and a truly stuck one look identical in the log.
        run: cargo build --workspace -vv

      - name: cargo test (integration)
        run: cargo test -p osquery --features integration-tests -vv -- --nocapture

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      # Also set as a real env var, not just via .cargo/config.toml:
      # actions-rust-lang/setup-rust-toolchain's own automatic `target/`
      # cache key explicitly hashes the RUSTFLAGS *environment variable*
      # (confirmed via its own cache-configuration log dump), not
      # .cargo/config.toml's content -- so a config.toml-only change is
      # invisible to that cache key, and a prior CI run silently restored
      # a stale, pre-fix (/MD-compiled) shim.o from cache despite the
      # config.toml fix being in place (same object-file hash, same
      # LNK2038 error, on the run right after that fix landed). Setting
      # the identical flag here as an env var busts that cache key too.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Enable long paths in git
        # osquery's own Windows build docs note path-length issues are a
        # known concern on this platform; belt-and-suspenders alongside
        # disabling OSQUERY_BUILD_AWS (which removed the worst offender).
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7

      # winflexbison3 provides win_flex/win_bison; osquery's CMake looks for
      # plain flex/bison names, so alias them. Unverified whether this (or
      # anything else about the Windows path, which uses an untested "NMake
      # Makefiles" CMake generator -- see osquery-sys/build.rs) is
      # sufficient; iterate here based on actual failures.
      - name: Install build prerequisites
        run: |
          choco install winflexbison3 -y
          $binDir = "$env:ChocolateyInstall\bin"
          Copy-Item "$binDir\win_flex.exe" "$binDir\flex.exe" -Force
          Copy-Item "$binDir\win_bison.exe" "$binDir\bison.exe" -Force
        shell: pwsh

      # Sets up cl.exe/link.exe/nmake.exe on PATH for subsequent steps --
      # required for the "NMake Makefiles" CMake generator our build.rs
      # forces on Windows.
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Restore osquery source + native build cache
        uses: actions/cache@v6
        with:
          path: target/osquery-sys
          key: osquery-sys-windows-${{ hashFiles('osquery-sys/build.rs') }}

      - name: cargo build
        # -vv makes Cargo forward build.rs's own captured stdout/stderr live
        # (plain -v only shows compiler invocation lines, not build-script
        # output) -- this build spawns cmake/git as child processes with
        # inherited stdio, so their progress only reaches the Actions log
        # stream at this verbosity. Without it, a genuinely slow multi-hour
        # native build and a truly stuck one look identical in the log.
        run: cargo build --workspace -vv

      - name: cargo test (integration)
        run: cargo test -p osquery --features integration-tests -vv -- --nocapture
