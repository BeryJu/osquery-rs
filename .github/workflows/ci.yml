name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # This workflow's whole purpose is verifying the from-source build path
  # keeps working -- without this, once a real release exists and
  # prebuilt-checksums.v1 has entries, every job here would silently take
  # the (much faster, much less thoroughly exercised by CI) prebuilt
  # download path instead, and this workflow would stop actually testing
  # what it's meant to. See osquery-sys/build.rs's try_prebuilt.
  OSQUERY_SYS_FORCE_SOURCE_BUILD: "1"

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    # Runs the whole job inside a manylinux2014 (CentOS 7, glibc 2.17)
    # container rather than directly on the bare ubuntu-latest runner, so
    # this build's *final link* (which dynamically resolves -lc/-lresolv
    # against whatever the host's own system libc is -- see
    # append_linux_default_linker_items in osquery-sys/build.rs) gets an
    # old, portable glibc floor. This matters specifically because of the
    # prebuilt-artifact distribution model: it's this CI job's own build
    # that gets uploaded and run on other people's machines, so the glibc
    # version *this container* provides directly determines the oldest
    # Linux distro the shipped artifact will work on. Matches osquery's own
    # upstream toolchain's compatibility target (see
    # OSQUERY_TOOLCHAIN_SYSROOT below, unrelated -- that's for compiling,
    # this is for the final link only).
    container: quay.io/pypa/manylinux2014_x86_64
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Install build prerequisites
        # No `sudo` inside the container -- already root, and manylinux
        # images don't necessarily even have a sudo binary. CentOS 7 is EOL
        # upstream (mirrorlist.centos.org 404s), so repoint yum at the
        # community-maintained vault mirror first -- a well-known, standard
        # fix for this exact class of image, though manylinux2014 may
        # already have this patched; harmless either way if so.
        run: |
          sed -i s/mirror.centos.org/vault.centos.org/g /etc/yum.repos.d/*.repo
          sed -i s/^#.*baseurl=http/baseurl=http/g /etc/yum.repos.d/*.repo
          sed -i s/^mirrorlist=http/#mirrorlist=http/g /etc/yum.repos.d/*.repo
          yum install -y git bison flex make ccache curl ca-certificates pkgconfig
          yum groupinstall -y "Development Tools"

      - name: Install a modern CMake
        # CentOS 7's stock yum cmake package is 2.8.12 -- far too old for
        # osquery. manylinux2014 ships several Python versions under
        # /opt/python/ specifically for building wheels, but the plain
        # `cmake` PyPI wheel is a perfectly good source of a modern,
        # portable prebuilt binary here too; simpler and more reliably
        # glibc-compatible than trying to compile a newer CMake from source
        # against this same old base.
        run: |
          PYBIN=$(ls -d /opt/python/cp3*-cp3*/bin | sort | tail -1)
          "$PYBIN/pip" install --quiet cmake
          ln -sf "$PYBIN/cmake" /usr/local/bin/cmake
          cmake --version

      - name: Ensure a plain python3 is on PATH
        # osquery's own CMake configure looks for a bare `python3`;
        # manylinux2014 only provides versioned paths under /opt/python/.
        run: |
          PYBIN=$(ls -d /opt/python/cp3*-cp3*/bin | sort | tail -1)
          ln -sf "$PYBIN/python3" /usr/local/bin/python3
          python3 --version

      - name: Install osquery-toolchain
        run: |
          set -eux
          curl -fsSL -o /tmp/toolchain.tar.xz \
            "https://github.com/osquery/osquery-toolchain/releases/download/1.3.0/osquery-toolchain-1.3.0-x86_64.tar.xz"
          tar xf /tmp/toolchain.tar.xz -C /usr/local
          rm /tmp/toolchain.tar.xz

      - name: Shim xlocale.h into the toolchain sysroot (only if missing)
        # osquery vendors augeas, whose gnulib submodule ships a pregenerated
        # header assuming <xlocale.h> exists; real xlocale.h was removed from
        # modern glibc years ago. This toolchain release's x86_64 build
        # ALREADY ships a complete, real xlocale.h (its glibc header
        # snapshot is old enough to still need it) -- only aarch64's is
        # missing it. Must check before writing: blindly overwriting
        # clobbers x86_64's working file with a shim that's circular there
        # (locale.h itself needs this type before it can finish processing
        # on that older snapshot). See README.md "Known local patches".
        run: |
          if [ ! -f /usr/local/osquery-toolchain/usr/include/xlocale.h ]; then
            printf '#pragma once\n#include <locale.h>\n' \
              > /usr/local/osquery-toolchain/usr/include/xlocale.h
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Restore osquery source + native build cache
        uses: actions/cache@v6
        with:
          # build.rs clones osquery's pinned tag itself (no git submodule)
          # and caches both the cloned source and the native build under
          # target/osquery-sys/{src,build}-<tag>/ -- see cargo_target_dir()
          # in osquery-sys/build.rs.
          path: target/osquery-sys
          key: osquery-sys-linux-${{ hashFiles('osquery-sys/build.rs') }}

      - name: cargo build
        # -vv makes Cargo forward build.rs's own captured stdout/stderr live
        # (plain -v only shows compiler invocation lines, not build-script
        # output) -- this build spawns cmake/git as child processes with
        # inherited stdio, so their progress only reaches the Actions log
        # stream at this verbosity. Without it, a genuinely slow multi-hour
        # native build and a truly stuck one look identical in the log.
        #
        # The backgrounded heartbeat loop is diagnostic: a prior Linux run
        # went completely silent for 60+ minutes with no way to tell
        # whether the runner itself froze or just the compiler process did.
        # If it happens again, comparing whether these heartbeat lines kept
        # appearing (system alive, something else hung) against `free -h`'s
        # own numbers (memory exhausted at the time it stopped) should
        # finally give a real answer instead of another guess.
        run: |
          ( while true; do
              sleep 60
              echo "=== heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
              free -h
              echo "--- top memory consumers ---"
              ps -eo pid,ppid,%mem,%cpu,etime,cmd --sort=-%mem | head -15
            done ) &
          HEARTBEAT_PID=$!
          trap 'kill "$HEARTBEAT_PID" 2>/dev/null || true' EXIT
          cargo build --workspace -vv

      - name: cargo test (integration)
        run: cargo test -p osquery --features integration-tests -vv -- --nocapture

  macos:
    name: macOS (aarch64)
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      # osquery's own docs state its macOS build is broken on Xcode SDK
      # >= 16.3; macos-14 runners ship multiple Xcode versions side by side.
      # Pin an explicit, older one rather than whatever Xcode.app currently
      # defaults to (unverified as of this writing -- adjust this version
      # if the build fails on SDK incompatibility; check
      # `ls /Applications | grep Xcode` in a run for what's actually
      # available on the runner image in use).
      - name: Select a supported Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Install build prerequisites
        run: brew install ccache git git-lfs cmake python clang-format flex bison

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Restore osquery source + native build cache
        uses: actions/cache@v6
        with:
          path: target/osquery-sys
          key: osquery-sys-macos-${{ hashFiles('osquery-sys/build.rs') }}

      - name: cargo build
        # -vv makes Cargo forward build.rs's own captured stdout/stderr live
        # (plain -v only shows compiler invocation lines, not build-script
        # output) -- this build spawns cmake/git as child processes with
        # inherited stdio, so their progress only reaches the Actions log
        # stream at this verbosity. Without it, a genuinely slow multi-hour
        # native build and a truly stuck one look identical in the log.
        run: cargo build --workspace -vv

      - name: cargo test (integration)
        run: cargo test -p osquery --features integration-tests -vv -- --nocapture

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Enable long paths in git
        # osquery's own Windows build docs note path-length issues are a
        # known concern on this platform; belt-and-suspenders alongside
        # disabling OSQUERY_BUILD_AWS (which removed the worst offender).
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7

      # winflexbison3 provides win_flex/win_bison; osquery's CMake looks for
      # plain flex/bison names, so alias them. Unverified whether this (or
      # anything else about the Windows path, which uses an untested "NMake
      # Makefiles" CMake generator -- see osquery-sys/build.rs) is
      # sufficient; iterate here based on actual failures.
      - name: Install build prerequisites
        run: |
          choco install winflexbison3 -y
          $binDir = "$env:ChocolateyInstall\bin"
          Copy-Item "$binDir\win_flex.exe" "$binDir\flex.exe" -Force
          Copy-Item "$binDir\win_bison.exe" "$binDir\bison.exe" -Force
        shell: pwsh

      # Sets up cl.exe/link.exe/nmake.exe on PATH for subsequent steps --
      # required for the "NMake Makefiles" CMake generator our build.rs
      # forces on Windows.
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Restore osquery source + native build cache
        uses: actions/cache@v6
        with:
          path: target/osquery-sys
          key: osquery-sys-windows-${{ hashFiles('osquery-sys/build.rs') }}

      - name: cargo build
        # -vv makes Cargo forward build.rs's own captured stdout/stderr live
        # (plain -v only shows compiler invocation lines, not build-script
        # output) -- this build spawns cmake/git as child processes with
        # inherited stdio, so their progress only reaches the Actions log
        # stream at this verbosity. Without it, a genuinely slow multi-hour
        # native build and a truly stuck one look identical in the log.
        run: cargo build --workspace -vv

      - name: cargo test (integration)
        run: cargo test -p osquery --features integration-tests -vv -- --nocapture
