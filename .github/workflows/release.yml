name: Release

# Triggered by pushing a version tag (v<CARGO_PKG_VERSION>, e.g. v0.1.0):
# builds osquery from source on all 4 target triples exactly like ci.yml
# does, but additionally stages each build's own outputs into a prebuilt bundle
# (see OSQUERY_SYS_PACKAGE_DIR / stage_prebuilt_package in
# osquery-sys/build.rs), uploads those bundles as GitHub Release assets,
# and only then runs `cargo publish`. This is what populates
# osquery-sys/prebuilt-checksums.v1 and makes the default download path in
# build.rs (try_prebuilt) actually have something to fetch for this version.
#
# Maintainer release process: bump workspace.package.version (and the
# workspace.dependencies.osquery-sys version pin next to it) in Cargo.toml,
# commit, tag that commit `v<version>`, push the tag -- everything else
# below is automated.
#
# Unverified against a real tag push as of this writing (same caveat as
# every other platform-specific piece of this project) -- expect iteration.

on:
  push:
    tags: ["v*"]

jobs:
  build-linux:
    name: Build prebuilt bundle (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Restore osquery source + native build cache
        uses: actions/cache@v6
        with:
          path: target/osquery-sys
          key: osquery-sys-linux-${{ hashFiles('osquery-sys/build.rs') }}

      - name: Build osquery-sys and stage the prebuilt bundle
        # See ci.yml's Linux job for why this runs via a manual `docker run`
        # rather than the job-level `container:` key: GitHub Actions injects
        # a Node.js runtime into a job-level container to run its own
        # JS-based steps (actions/checkout, actions/cache, ...), and modern
        # Node needs a far newer glibc than manylinux2014's CentOS-7-era
        # 2.17 -- that combination crashes actions/checkout itself, before
        # any of our own steps run. The container's old glibc only needs to
        # be present for the actual build/link, not for anything Actions
        # itself runs -- same reasoning as ci.yml, doubly so here since this
        # job's own build output is exactly what gets uploaded and shipped
        # to consumers.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e OSQUERY_SYS_PACKAGE_DIR="${{ github.workspace }}/pkg" \
            quay.io/pypa/manylinux2014_x86_64 \
            bash .github/scripts/manylinux-entrypoint.sh \
            cargo build --workspace -vv

      - name: Package and hash the bundle
        shell: bash
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="x86_64-unknown-linux-gnu"
          mkdir -p dist
          tar --zstd -cf "dist/osquery-sys-${VERSION}-${TARGET}.tar.zst" -C pkg .
          sha256sum "dist/osquery-sys-${VERSION}-${TARGET}.tar.zst" \
            | awk '{print $1}' > "dist/osquery-sys-${VERSION}-${TARGET}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt-x86_64-unknown-linux-gnu
          path: dist/*

  build-linux-arm64:
    name: Build prebuilt bundle (Linux aarch64)
    # GitHub's native arm64-hosted runner (GA for public/private repos) --
    # a real aarch64 host, not emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Restore osquery source + native build cache
        uses: actions/cache@v6
        with:
          path: target/osquery-sys
          key: osquery-sys-linux-arm64-${{ hashFiles('osquery-sys/build.rs') }}

      - name: Build osquery-sys and stage the prebuilt bundle
        # manylinux_2_34 (glibc 2.34), not manylinux2014 (glibc 2.17) like
        # the x86_64 job above, and not manylinux_2_28 (glibc 2.28) either:
        # the osquery-toolchain's own aarch64 clang/LLVM 18.1 binary can't
        # run at all on glibc 2.17 ("/lib64/libm.so.6: version `GLIBC_2.27'
        # not found"), unlike the x86_64 build of the same toolchain
        # release; manylinux_2_28 satisfies clang itself but not its
        # *bundled assembler*, which separately needs glibc>=2.34
        # ("/lib64/libc.so.6: version `GLIBC_2.34' not found (required by
        # .../usr/bin/as)") -- only surfaced once an actual assembly file
        # got compiled (libgcrypt's mpih-mul3-asm.S), since `clang
        # --version` alone doesn't exercise the assembler. manylinux_2_34
        # satisfies both; verified directly (both `clang --version` and an
        # actual `.S` compile) before committing to it, not assumed. This
        # means the shipped aarch64 Linux artifact's glibc floor (2.34) is
        # considerably newer than the x86_64 artifact's (2.17); see
        # ci.yml's aarch64 job for the same container, so CI actually
        # exercises what gets shipped here.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e OSQUERY_SYS_PACKAGE_DIR="${{ github.workspace }}/pkg" \
            quay.io/pypa/manylinux_2_34_aarch64 \
            bash .github/scripts/manylinux-entrypoint.sh \
            cargo build --workspace -vv

      - name: Package and hash the bundle
        shell: bash
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="aarch64-unknown-linux-gnu"
          mkdir -p dist
          tar --zstd -cf "dist/osquery-sys-${VERSION}-${TARGET}.tar.zst" -C pkg .
          sha256sum "dist/osquery-sys-${VERSION}-${TARGET}.tar.zst" \
            | awk '{print $1}' > "dist/osquery-sys-${VERSION}-${TARGET}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt-aarch64-unknown-linux-gnu
          path: dist/*

  build-macos:
    name: Build prebuilt bundle (macOS aarch64)
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Select a supported Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Install build prerequisites
        run: brew install ccache git git-lfs cmake python clang-format flex bison

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Restore osquery source + native build cache
        uses: actions/cache@v6
        with:
          path: target/osquery-sys
          key: osquery-sys-macos-${{ hashFiles('osquery-sys/build.rs') }}

      - name: Build osquery-sys and stage the prebuilt bundle
        env:
          OSQUERY_SYS_PACKAGE_DIR: ${{ github.workspace }}/pkg
        run: cargo build --workspace -vv

      - name: Package and hash the bundle
        shell: bash
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="aarch64-apple-darwin"
          mkdir -p dist
          tar --zstd -cf "dist/osquery-sys-${VERSION}-${TARGET}.tar.zst" -C pkg .
          shasum -a 256 "dist/osquery-sys-${VERSION}-${TARGET}.tar.zst" \
            | awk '{print $1}' > "dist/osquery-sys-${VERSION}-${TARGET}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt-aarch64-apple-darwin
          path: dist/*

  build-windows:
    name: Build prebuilt bundle (Windows x86_64)
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      # See ci.yml's Windows job for why this is also set as a real env
      # var and not left to .cargo/config.toml alone (that action's own
      # `target/` cache key hashes the RUSTFLAGS env var specifically).
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Enable long paths in git
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7

      - name: Install build prerequisites
        run: |
          choco install winflexbison3 -y
          $binDir = "$env:ChocolateyInstall\bin"
          Copy-Item "$binDir\win_flex.exe" "$binDir\flex.exe" -Force
          Copy-Item "$binDir\win_bison.exe" "$binDir\bison.exe" -Force
        shell: pwsh

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Restore osquery source + native build cache
        uses: actions/cache@v6
        with:
          path: target/osquery-sys
          key: osquery-sys-windows-${{ hashFiles('osquery-sys/build.rs') }}

      - name: Build osquery-sys and stage the prebuilt bundle
        env:
          OSQUERY_SYS_PACKAGE_DIR: ${{ github.workspace }}\pkg
        run: cargo build --workspace -vv

      - name: Package and hash the bundle
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $target = "x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          tar --zstd -cf "dist/osquery-sys-$version-$target.tar.zst" -C pkg .
          $hash = (Get-FileHash "dist/osquery-sys-$version-$target.tar.zst" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/osquery-sys-$version-$target.sha256" -Value $hash -NoNewline

      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt-x86_64-pc-windows-msvc
          path: dist/*

  finalize:
    name: Commit checksums, upload release, verify, publish
    needs: [build-linux, build-linux-arm64, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The checksums-file commit below lands on main's current tip,
          # not the tagged commit specifically -- recording a version's
          # bundle hashes doesn't need to be tied to that exact tree, and
          # trying to push directly onto a historical tagged commit isn't
          # meaningfully different from "make a new commit on top of main"
          # anyway.
          ref: main

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: prebuilt-*
          merge-multiple: true

      - name: Update prebuilt-checksums.v1
        shell: bash
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          CHECKSUMS="osquery-sys/prebuilt-checksums.v1"
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            hash=$(cat "dist/osquery-sys-${VERSION}-${target}.sha256")
            # Drop any existing line for this exact target (e.g. re-tagging
            # the same version after fixing a release problem), then
            # append the freshly computed one.
            grep -v "^${target}	" "$CHECKSUMS" > "${CHECKSUMS}.tmp" || true
            mv "${CHECKSUMS}.tmp" "$CHECKSUMS"
            printf '%s\t%s\n' "$target" "$hash" >> "$CHECKSUMS"
          done
          cat "$CHECKSUMS"

      - name: Commit checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add osquery-sys/prebuilt-checksums.v1
          git commit -m "Record prebuilt bundle checksums for ${{ github.ref_name }}"
          git push origin HEAD:main

      - name: Create draft release and upload bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft --generate-notes \
            dist/osquery-sys-*.tar.zst

      - name: Self-verify uploaded assets before publishing
        # Re-download each just-uploaded asset (gh CLI can read draft
        # release assets with the workflow's own token, same as a
        # published one) and compare against the hash computed from the
        # exact bytes we uploaded -- catches a broken/corrupted upload
        # immediately, in CI, rather than relying on a consumer's own
        # build.rs eventually noticing a checksum mismatch.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf verify && mkdir verify
          gh release download "${{ github.ref_name }}" --dir verify --pattern "*.tar.zst"
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            expected=$(cat "dist/osquery-sys-${VERSION}-${target}.sha256")
            actual=$(sha256sum "verify/osquery-sys-${VERSION}-${target}.tar.zst" | awk '{print $1}')
            if [ "$expected" != "$actual" ]; then
              echo "::error::Uploaded asset for ${target} does not match its computed hash (expected $expected, got $actual) -- NOT publishing the release."
              exit 1
            fi
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false

      # - name: cargo publish
      #   # Requires a CARGO_REGISTRY_TOKEN repo secret (crates.io API token
      #   # with publish rights for both crates) -- a one-time manual setup
      #   # step, not something this workflow can configure itself.
      #   env:
      #     CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      #   run: |
      #     cargo publish -p osquery-sys --locked
      #     cargo publish -p osquery --locked
