name: Update osquery

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bump OSQUERY_TAG to latest osquery release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          latest=$(gh api repos/osquery/osquery/releases/latest --jq .tag_name)
          sed -i "s/^const OSQUERY_TAG: &str = \".*\";/const OSQUERY_TAG: \&str = \"${latest}\";/" osquery-sys/build.rs
          echo "version=${latest}" >> "$GITHUB_OUTPUT"

      # No-op when OSQUERY_TAG is already current (nothing to commit).
      # Note: PRs opened with the default GITHUB_TOKEN don't trigger other
      # workflows, so CI won't run on them automatically -- swap `token` for a
      # PAT/App token if that's wanted.
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: osquery-update
          commit-message: "core: bump osquery to ${{ steps.bump.outputs.version }}"
          title: "core: bump osquery to ${{ steps.bump.outputs.version }}"
          body: "Bumps `OSQUERY_TAG` in `osquery-sys/build.rs` to [osquery ${{ steps.bump.outputs.version }}](https://github.com/osquery/osquery/releases/tag/${{ steps.bump.outputs.version }})."
          labels: dependencies
          assignees: BeryJu
