[workspace]
resolver = "2"
members = ["osquery-sys", "osquery"]

[workspace.dependencies]
# `version` is required here (not just `path`) because `cargo publish`
# strips path info from a packaged crate's manifest, leaving only the
# version requirement to resolve the dependency against crates.io --
# without it, `cargo publish -p osquery` fails outright. Both crates always
# share the same version (via workspace.package.version below), so this
# must be bumped in lockstep with that whenever either is released.
osquery-sys = { path = "osquery-sys", version = "0.1.3" }

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/BeryJu/osquery-rs"
keywords = ["osquery", "sql", "security", "monitoring", "ffi"]
categories = ["api-bindings", "os"]
# NOTE: `readme` is deliberately NOT set here. Cargo's workspace-inheritance
# copies a relative `readme` path verbatim into each member rather than
# re-anchoring it to that member's own directory, so `readme.workspace =
# true` here would make every member look for its own `README.md` instead
# of the shared root one. Each crate sets `readme = "../README.md"`
# directly instead.
